{% extends 'news/base.html' %}
{% block content %}
<div class="login-container">
  <h2>Login</h2>

  {% if form.errors %}
    <p style="color: red;">Your username or password was incorrect. Please try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label>Username:</label>
    {{ form.username }}
    <br>
    <label>Password:</label>
    {{ form.password }}
    <br>
    <button type="submit">Login</button>
  </form>

  <p>Don’t have an account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
