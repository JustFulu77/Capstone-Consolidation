{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old-School News Portal</title>
    <link rel="stylesheet" href="{% static 'news/style.css' %}">
    <style>
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #f5f0e6;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6b4226;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        a:hover {
            background-color: #4d2e1e;
        }
    </style>
</head>
<body>
    <div>
        <h1>Old-School News Portal</h1>
        <a href="{% url 'reader-articles' %}">Go to Articles</a>
    </div>
</body>
</html>
