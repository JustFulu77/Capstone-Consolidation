{% extends 'news/base.html' %}

{% block title %}Delete Article{% endblock %}

{% block content %}
<h2>Are you sure you want to delete "{{ article.title }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-reject">Yes, Delete</button>
</form>

<a href="{% url 'journalist-dashboard' %}">Cancel</a>
{% endblock %}
